services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - supabase
    labels:
      - traefik.http.services.api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

networks:
  supabase:
    name: r8brcpnzrcoig6yk7338hhep
    external: true
