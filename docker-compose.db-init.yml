services:
  db-init:
    image: postgres:15-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${PGPASSWORD}
      DB_PASS: ${DB_PASS}
    networks:
      - supabase
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set +e
        apk add --no-cache curl >/dev/null 2>&1
        echo "[merveille] fetching init script"
        curl -fsSL "https://raw.githubusercontent.com/princeAkim226/merveille_pro/main/deploy/init-merveille-db.sh" -o /tmp/init-merveille-db.sh
        echo "[merveille] script bytes: $$(wc -c </tmp/init-merveille-db.sh)"
        /bin/sh /tmp/init-merveille-db.sh
        EC=$$?
        echo "[merveille] init exit=$$EC"
        sleep 300
        exit $$EC

networks:
  supabase:
    name: r8brcpnzrcoig6yk7338hhep
    external: true
