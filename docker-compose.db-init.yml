services:
  db-init:
    image: postgres:15-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${PGPASSWORD}
      DB_PASS: ${DB_PASS}
    networks:
      - supabase
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache curl >/dev/null
        curl -fsSL "https://raw.githubusercontent.com/princeAkim226/merveille_pro/main/deploy/init-merveille-db.sh" -o /tmp/init-merveille-db.sh
        chmod +x /tmp/init-merveille-db.sh
        /bin/sh /tmp/init-merveille-db.sh

networks:
  supabase:
    name: r8brcpnzrcoig6yk7338hhep
    external: true
