# Blueprint Render pour Merveille Pro (backend Django)
# Docs : https://render.com/docs/blueprint-spec

databases:
  - name: merveille-pro-db
    plan: free
    databaseName: merveille_pro
    user: merveille

services:
  - type: web
    name: merveille-pro-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: merveille-pro-db
          property: connectionString
