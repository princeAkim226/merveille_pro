services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8000
    networks:
      - coolify
      - supabase
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  coolify:
    external: true
  supabase:
    name: r8brcpnzrcoig6yk7338hhep
    external: true
